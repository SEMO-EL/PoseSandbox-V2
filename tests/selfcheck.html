<!DOCTYPE html>
<!-- Self-checks for the editor's logic. Open it from a local server; the page title ends in PASS or FAIL. -->
<html lang="en"><head><meta charset="utf-8"><title>PoseSandbox self-check</title>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}</script>
<style>body{font:14px/1.5 system-ui;background:#0b0f17;color:#ddd;padding:20px}.ok{color:#6f6}.bad{color:#f66}</style></head>
<body><h1>PoseSandbox self-check</h1><ol id="out"></ol>
<script type="module">
import * as THREE from "three";
import { Mannequin, CHAINS, PROPORTIONS, loadSculpt } from "../character/character.js";
import { createWorld, createProp } from "../core/world.js";
import { createHistory } from "../core/history.js";
import { isTypingTarget } from "../core/helpers.js";
import { createCustomLight } from "../lights/custom-lights.js";
import { solveTwoBone, aim, clampHinge } from "../controls/ik.js";
import { serializeScene, applyScene, mirrorPose } from "../poses/pose-io.js";
import { PRESETS, applyPreset } from "../poses/presets.js";

const results = [];
const check = (name, ok, detail = "") => results.push({ name, ok: !!ok, detail });
const rig = () => {
  const scene = new THREE.Scene();
  const figure = new Mannequin(scene).create();
  const world = createWorld(scene);
  let cam = { position: [1, 1, 1], target: [0, 1, 0], fov: 40 };
  const figures = [figure];
  const addFigure = () => { const f = new Mannequin(scene).create(); figures.push(f); return f; };
  const removeFigure = (f) => { figures.splice(figures.indexOf(f), 1); f.dispose(); };
  return { scene, figure, world, ctx: { figure, figures, addFigure, removeFigure, world, cameraState: () => cam, setCameraState: (c) => (cam = c) } };
};
const json = (ctx) => JSON.stringify(serializeScene(ctx, { camera: false }));

// 1 · IK puts the hand on a reachable target, and stops short (straight arm) on an unreachable one
{
  const { figure } = rig();
  const [a, b, c] = CHAINS.l_arm.map((n) => figure.joint(n));
  const target = new THREE.Vector3(-0.25, 1.35, 0.35);
  const miss = solveTwoBone(a, b, c, target, new THREE.Vector3(0, 0, -1));
  const got = c.getWorldPosition(new THREE.Vector3());
  check("IK reaches a reachable target", miss === 0 && got.distanceTo(target) < 1e-3, `off by ${got.distanceTo(target).toExponential(2)} m`);
  const far = new THREE.Vector3(-3, 1.4, 0);
  const miss2 = solveTwoBone(a, b, c, far, new THREE.Vector3(0, 0, -1));
  check("IK reports the gap to an unreachable target", miss2 > 2, `missing ${miss2.toFixed(2)} m`);
}

// 2 · save → load gives the same document (joints, moves, scales, props, lights)
{
  const A = rig();
  applyPreset(A.figure, PRESETS.find((p) => p.id === "run"));
  A.figure.joint("head").userData.segment.scale.set(1.2, 1.2, 1.2);
  A.world.add(createProp("block", { color: "#ff0000" })).position.set(0.5, 0, 0.4);
  A.world.add(createCustomLight("spot", { intensity: 30, angle: 20 })).position.set(-1, 2, 1);
  const doc = serializeScene(A.ctx, { camera: true, notes: "hi" });
  const B = rig();
  applyScene(JSON.parse(JSON.stringify(doc)), B.ctx);
  const ja = json(A.ctx), jb = json(B.ctx), at = [...ja].findIndex((ch, i) => ch !== jb[i]);
  check("save → load round trip is lossless", ja === jb, at < 0 ? "" : `first difference: …${ja.slice(at - 40, at + 30)}… vs …${jb.slice(at - 40, at + 30)}…`);
  check("camera travels with the pose", B.ctx.cameraState().fov === 40);
}

// 3 · a v1 file (bare quaternions per joint, as in the Starter Pack) still loads
{
  const { figure, ctx } = rig();
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(-1, 0, 0));
  applyScene({ version: 1, joints: { l_elbow: q.toArray(), char_root: [0, 0, 0, 1] }, props: [{ type: "sphere", position: [1, 0, 0] }] }, ctx);
  check("v1 pose files load", figure.joint("l_elbow").quaternion.angleTo(q) < 1e-6 && ctx.world.live("prop").length === 1);
}

// 4 · mirroring twice gives the original pose back
{
  const { ctx } = rig();
  applyPreset(ctx.figure, PRESETS.find((p) => p.id === "point"));
  const before = json(ctx);
  mirrorPose(ctx.figure); const once = json(ctx);
  mirrorPose(ctx.figure);
  check("mirror changes the pose, mirror twice restores it", once !== before && json(ctx) === before);
}

// 5 · undo / redo
{
  const { ctx } = rig();
  const h = createHistory({ capture: () => json(ctx), restore: (s) => applyScene(JSON.parse(s), ctx, { camera: false }) });
  const start = json(ctx);
  ctx.figure.joint("r_knee").rotation.x = 1; h.commit();
  const bent = json(ctx);
  h.undo();
  const undone = json(ctx);
  h.redo();
  check("undo restores, redo re-applies", undone === start && json(ctx) === bent && !h.canRedo());
}

// 6 · shortcuts are ignored while typing
{
  const ta = document.createElement("textarea"), cb = Object.assign(document.createElement("input"), { type: "checkbox" }), tx = document.createElement("input");
  check("typing guard: text fields yes, checkboxes no", isTypingTarget(ta) && isTypingTarget(tx) && !isTypingTarget(cb));
}

// 7 · presets land on the floor
{
  const { figure } = rig();
  const bad = [];
  for (const p of PRESETS) {
    applyPreset(figure, p);
    figure.root.updateMatrixWorld(true);
    const box = new THREE.Box3();
    figure.root.traverse((o) => { if (o.isMesh && !o.userData.helper) box.expandByObject(o, true); });
    const want = p.lift || 0;
    if (Math.abs(box.min.y - want) > 1e-3) bad.push(`${p.id} ${box.min.y.toFixed(3)}`);
  }
  check("every preset stands on the floor", !bad.length, bad.join(", "));
}

// 8 · the sculpted rig: bound exactly at rest, weights sum to 1, poses stay on the floor, IK still reaches
{
  await loadSculpt("../assets/models/mannequin.glb");
  const scene = new THREE.Scene();
  const fig = new Mannequin(scene).create("sculpted");
  const mesh = fig.skinned, pos = mesh.geometry.attributes.position, sw = mesh.geometry.attributes.skinWeight;
  fig.root.updateMatrixWorld(true);
  let worst = 0, sumOff = 0;
  const v = new THREE.Vector3(), r = new THREE.Vector3();
  for (let i = 0; i < pos.count; i += 37) {
    mesh.getVertexPosition(i, v);
    worst = Math.max(worst, v.distanceTo(r.fromBufferAttribute(pos, i)));
    sumOff = Math.max(sumOff, Math.abs(sw.getX(i) + sw.getY(i) + sw.getZ(i) + sw.getW(i) - 1));
  }
  check("sculpted: skin sits exactly on the sculpt at rest", worst < 1e-5, `max offset ${worst.toExponential(1)} m`);
  check("sculpted: every vertex's weights sum to 1", sumOff < 1e-3, `max error ${sumOff.toFixed(4)}`);
  const bad = [];
  for (const p of PRESETS) {
    applyPreset(fig, p);
    fig.root.updateMatrixWorld(true);
    const box = new THREE.Box3().expandByObject(mesh, true);
    if (Math.abs(box.min.y - (p.lift || 0)) > 2e-3) bad.push(`${p.id} ${box.min.y.toFixed(3)}`);
  }
  check("sculpted: every preset stands on the floor", !bad.length, bad.join(", "));
  fig.resetPose();
  const [a, b, c] = CHAINS.r_leg.map((n) => fig.joint(n));
  const target = c.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, 0.25, 0.2));
  solveTwoBone(a, b, c, target, new THREE.Vector3(0, 0, 1));
  check("sculpted: leg IK reaches its target", c.getWorldPosition(new THREE.Vector3()).distanceTo(target) < 1e-3);
}

// 9 · several figures: each keeps its own pose through save → load, and a one-figure document sends the others away
{
  const A = rig();
  const solo = json(A.ctx);
  const second = A.ctx.addFigure();
  applyPreset(second, PRESETS.find((p) => p.id === "sit"));
  second.root.position.x = 0.9;
  second.setSkin("wood");
  const doc = serializeScene(A.ctx, { camera: false });
  const B = rig();
  applyScene(JSON.parse(JSON.stringify(doc)), B.ctx);
  check("two figures survive save → load", B.ctx.figures.length === 2 && json(A.ctx) === json(B.ctx) && B.ctx.figures[1].skin === "wood" && B.scene.children.includes(B.ctx.figures[1].root));
  applyScene(JSON.parse(solo), B.ctx);
  check("a one-figure document removes the extra figure", B.ctx.figures.length === 1 && json(B.ctx) === solo && B.scene.children.filter((o) => o.name === "char_root").length === 1);
}

// 10 · dragging a part swings it about its joint so the grabbed point lands under the pointer
{
  const { figure } = rig();
  const j = figure.joint("l_shoulder");
  figure.root.updateMatrixWorld(true);
  const pivot = j.getWorldPosition(new THREE.Vector3());
  const grabbed = pivot.clone().add(new THREE.Vector3(0, -0.2, 0)), local = j.worldToLocal(grabbed.clone());
  const to = pivot.clone().add(new THREE.Vector3(-0.2, 0, 0.05));
  aim(j, pivot, grabbed, to);
  const now = j.localToWorld(local.clone()).sub(pivot).normalize(), want = to.clone().sub(pivot).normalize();
  check("drag-to-pose: the grabbed point follows the pointer", now.distanceTo(want) < 1e-4);
}

// 11 · a dragged elbow stays a hinge: no twist, no bending backwards, never past 150 degrees
{
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(-3, 0.6, 0.3));
  clampHinge(q, -2.62, 0.05);
  const back = clampHinge(new THREE.Quaternion().setFromEuler(new THREE.Euler(0.9, 0, 0)), -2.62, 0.05);
  const fine = clampHinge(new THREE.Quaternion().setFromEuler(new THREE.Euler(-1.2, 0, 0)), -2.62, 0.05);
  const ang = (x) => 2 * Math.atan2(x.x, x.w);
  check("hinge limit: elbows and knees bend one way only", q.y === 0 && q.z === 0 && Math.abs(ang(q) + 2.62) < 1e-6 && Math.abs(ang(back) - 0.05) < 1e-6 && Math.abs(ang(fine) + 1.2) < 1e-6);
}

// 12 · IK with hinges: the hand still lands on the target, and the elbow and knee turn about X only, the right way
{
  const { figure } = rig();
  const bad = [];
  for (const [chain, sign, off] of [["l_arm", -1, [-0.2, 0.3, 0.3]], ["r_arm", -1, [0.25, 0.5, -0.1]], ["l_leg", 1, [-0.1, 0.3, 0.25]], ["r_leg", 1, [0.2, 0.2, -0.2]]]) {
    const [a, b, c] = CHAINS[chain].map((n) => figure.joint(n));
    const target = c.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(...off));
    solveTwoBone(a, b, c, target, new THREE.Vector3(0, 0, sign), sign);
    const q = b.quaternion, miss = c.getWorldPosition(new THREE.Vector3()).distanceTo(target);
    if (miss > 1e-3 || Math.abs(q.y) > 0.02 || Math.abs(q.z) > 0.02 || q.x * q.w * sign <= 0) bad.push(`${chain}: off ${miss.toExponential(1)}, q ${q.toArray().map((v) => v.toFixed(3))}`);
  }
  check("hinged IK reaches and bends elbows and knees about one axis", !bad.length, bad.join("; "));
}

// 13 · proportions: every preset body stands on the floor at rest, keeps its pose, survives save → load, and
//      going back to Standard gives the standard figure back exactly
{
  const A = rig(), fig = A.figure, bad = [];
  const standard = json(A.ctx);
  applyPreset(fig, PRESETS.find((p) => p.id === "walk"));
  const walk = fig.joint("l_hip").quaternion.clone();
  for (const [k, P] of Object.entries(PROPORTIONS)) {
    fig.setProportions(P);
    if (fig.joint("l_hip").quaternion.angleTo(walk) > 1e-6) bad.push(k + " lost the pose");
    const keep = fig.capture();
    fig.resetPose();
    fig.root.updateMatrixWorld(true);
    const box = new THREE.Box3();
    fig.root.traverse((o) => { if (o.isMesh && !o.userData.helper) box.expandByObject(o, true); });
    if (Math.abs(box.min.y) > 0.012) bad.push(`${k} rests ${box.min.y.toFixed(3)} off the floor`);
    fig.restore(keep);
  }
  const B = rig();
  applyScene(JSON.parse(JSON.stringify(serializeScene(A.ctx, { camera: false }))), B.ctx);
  if (json(A.ctx) !== json(B.ctx) || Math.abs(B.figure.proportions.head - PROPORTIONS.chibi.head) > 1e-9) bad.push("save → load changed it");
  fig.setProportions(PROPORTIONS.standard);
  fig.resetPose();
  if (json(A.ctx) !== standard) bad.push("Standard is not the standard figure any more");
  check("proportions: on the floor, pose kept, saved, and reversible", !bad.length, bad.join("; "));
}

const out = document.getElementById("out");
for (const r of results) out.insertAdjacentHTML("beforeend", `<li class="${r.ok ? "ok" : "bad"}">${r.ok ? "PASS" : "FAIL"} — ${r.name} ${r.detail ? `<small>(${r.detail})</small>` : ""}</li>`);
const pass = results.every((r) => r.ok);
document.title = `PoseSandbox self-check: ${results.filter((r) => r.ok).length}/${results.length} ${pass ? "PASS" : "FAIL"}`;
window.__result = { pass, results };
</script></body></html>
